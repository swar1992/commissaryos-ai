
services:
  postgres:
    image: postgres:16
    container_name: commissaryos-postgres
    environment:
      POSTGRES_DB: commissaryos
      POSTGRES_USER: commissary
      POSTGRES_PASSWORD: localdev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commissary -d commissaryos"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
