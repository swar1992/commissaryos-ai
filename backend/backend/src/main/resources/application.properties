spring.application.name=commissaryos-ai
server.port=8080

# PostgreSQL connection
spring.datasource.url=jdbc:postgresql://localhost:5432/commissaryos
spring.datasource.username=${DB_USERNAME:commissary}
spring.datasource.password=${DB_PASSWORD:localdev}

# Hibernate / JPA
#spring.jpa.hibernate.ddl-auto=none
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Actuator
management.endpoints.web.exposure.include=health,info